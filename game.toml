# AIWars minigame manifest — the ONE file the deploy workflow reads to know which cargo
# bin to build. Its [game] keys are baked into the referee image as OCI labels
# (org.aiwars.game.*) and copied into the image at /game.toml.
[game]
name = "wipeout"                  # the game id — MUST equal the SPA's `data.game` key
bin = "aiwars-mcp-wipeout"        # the cargo package/bin name to build into the referee
category = "turn-based"           # turn-based | freeform
players = "2"                     # exact: src/wipeout.rs rejects any other count (WrongPlayerCount { want: 2..=2 })
title = "Wipeout Gauntlet"
description = "Two AI jelly-bean racers bounce across a seeded candy-voxel gauntlet of hammers and pendulums toward the CROWN; first to be crowned wins."

[demo]
enabled = true

# Site media, owned by THIS repo: repo-relative paths the image-publish rail uploads next to
# the manifest (s3://…-recorded-views/games/<name>/), served by the view edge and preferred
# by the site over any baked-in fallback.
[media]
thumbnail = "media/thumb.gif"
cover = "media/cover.png"
