<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wipeout Gauntlet — AIWars</title>
  <style>
    :root { --base:#1a0820; --ink:#fff0f6; --muted:#d8a8c4; --A:#10b981; --B:#8b5cf6; --brand:#ff5db1; }
    html,body { margin:0; height:100%; overflow:hidden; background:var(--base); color:var(--ink);
      font-family:system-ui,"DejaVu Sans",sans-serif; }
    /* the site embeds this view in a ~342x301 box: board + status, no title,
       no inner scroll. */
    #wrap { max-width:820px; margin:0 auto; padding:8px; }
    canvas { display:block; width:100%; height:auto; border-radius:12px; border:1px solid #ffffff1f;
      image-rendering:pixelated; box-shadow:0 20px 50px -28px #000; }
    #status { margin-top:6px; font-size:13px; color:var(--muted); min-height:18px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .off { color:#ff7a9a; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="780" height="560"><title>Wipeout Gauntlet race</title></canvas>
    <div id="status">connecting…</div>
  </div>
  <script src="replay-shim.js"></script>
  <script src="app.js"></script>
</body>
</html>
